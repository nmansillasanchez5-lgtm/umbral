:root{
  --ink:#1F1A1E; --muted:#6B6168; --line:#EEE5F0; --white:#FFFFFF;
  --pink:#C2185B; --pinkfill:#F8BBD3; --pinkwash:#FFE6F0;
  --lav:#6D4BD1; --lavfill:#E3DCFA; --lavwash:#F1ECFD;
  --acc:var(--pink); --accwash:var(--pinkwash);
  --glass:rgba(255,255,255,.74);
  --disp:"DM Serif Display",Georgia,"Times New Roman",serif;
  --ui:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
body[data-t=menu],body[data-t=prog]{--acc:var(--lav);--accwash:var(--lavwash)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--ui);line-height:1.45;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;isolation:isolate;overflow:hidden}
/* difuminados de cada pantalla */
.wash{position:absolute;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none;overflow:hidden}
.wash i{position:absolute;border-radius:50%;filter:blur(34px)}
.wash .a{width:320px;height:320px;right:-130px;top:-120px;background:radial-gradient(closest-side,rgba(194,24,91,.34),transparent)}
.wash .b{width:300px;height:300px;left:-140px;top:120px;background:radial-gradient(closest-side,rgba(109,75,209,.26),transparent)}
.wash .d{width:340px;height:340px;left:-150px;top:58%;background:radial-gradient(closest-side,rgba(194,24,91,.16),transparent)}
.wash .e{width:360px;height:360px;right:-160px;top:80%;background:radial-gradient(closest-side,rgba(109,75,209,.2),transparent)}
body[data-t=menu] .wash .d,body[data-t=prog] .wash .d{background:radial-gradient(closest-side,rgba(109,75,209,.17),transparent)}
body[data-t=menu] .wash .e,body[data-t=prog] .wash .e{background:radial-gradient(closest-side,rgba(194,24,91,.14),transparent)}
.wash .c{width:240px;height:240px;right:-100px;top:330px;background:radial-gradient(closest-side,rgba(194,24,91,.13),transparent)}
body[data-t=menu] .wash .a,body[data-t=prog] .wash .a{background:radial-gradient(closest-side,rgba(109,75,209,.32),transparent);left:-120px;right:auto}
body[data-t=menu] .wash .b,body[data-t=prog] .wash .b{background:radial-gradient(closest-side,rgba(109,75,209,.16),transparent);left:auto;right:-130px}
body[data-t=menu] .wash .c,body[data-t=prog] .wash .c{background:radial-gradient(closest-side,rgba(194,24,91,.12),transparent)}
body[data-t=cal] .wash .a{background:radial-gradient(closest-side,rgba(109,75,209,.3),transparent)}
body[data-t=cal] .wash .b{background:radial-gradient(closest-side,rgba(194,24,91,.2),transparent)}

.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px}
.logo{font-family:var(--disp);font-size:22px;color:var(--pink);letter-spacing:.02em}
.logo i{display:inline-block;width:.36em;height:.36em;border-radius:50%;background:var(--lav);margin-left:3px;box-shadow:0 0 0 3px rgba(109,75,209,.16)}
.top .where{margin-left:auto;font-size:13px;color:var(--muted)}
.top .back{border:0;background:var(--lavwash);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{display:flex;width:100%;max-width:560px;padding:4px 6px 2px}
.nav button{flex:1;border:0;background:none;padding:4px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted)}
.nav .ic{width:50px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=true]{color:var(--ink);font-weight:600}
.nav button[aria-current=true] .ic{background:var(--accwash);color:var(--acc)}
main{padding:20px 18px calc(110px + env(safe-area-inset-bottom,0px))}

h1{font-family:var(--disp);font-weight:400;font-size:33px;line-height:1.06;margin:0 0 6px;color:var(--acc);text-wrap:balance}
h1.ink{color:var(--ink)}
h2{font-family:var(--disp);font-weight:400;font-size:22px;line-height:1.15;margin:0;color:var(--acc);text-wrap:balance}
h2.ink{color:var(--ink)}
h3{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.sub{font-size:14px;color:var(--muted);margin:0 0 12px}
.small{font-size:13px;color:var(--muted)}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px;background:#fff;border:1.5px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.p{background:var(--pinkfill);border-color:var(--pinkfill)}
.chip.l{background:var(--lavfill);border-color:var(--lavfill)}
.card{background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:0 12px 26px -18px rgba(80,40,130,.55),0 0 0 1px var(--line);padding:16px;margin-bottom:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card.flat{box-shadow:0 0 0 1px var(--line);background:linear-gradient(135deg,rgba(255,255,255,.9),var(--accwash));backdrop-filter:none}
.card.tint{background:linear-gradient(135deg,var(--lavwash),var(--pinkwash));box-shadow:0 0 0 1px var(--line)}
.ex,.dcard,.slot{position:relative;overflow:hidden}
.ex::before,.dcard::before,.slot::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--pink),#8E3BA8,var(--lav))}
.sec h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lav));margin-right:8px;vertical-align:2px}
details.card{background:linear-gradient(135deg,rgba(255,255,255,.85),var(--accwash))}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--lavwash);font-size:14px;margin-bottom:12px}
.heart{background:linear-gradient(135deg,var(--pinkwash),var(--lavwash))}
.note.p{background:var(--pinkwash)}
.note svg{flex:none;margin-top:2px;width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:block;width:100%;text-align:center;font-weight:600;font-size:16px;padding:15px;border-radius:16px;border:0;color:#fff;background:linear-gradient(100deg,#C2185B 0%,#8E3BA8 55%,#6D4BD1 100%);box-shadow:0 12px 24px -12px rgba(109,75,209,.7)}
body[data-t=menu] .btn:not(.ghost),body[data-t=prog] .btn:not(.ghost){background:linear-gradient(100deg,#6D4BD1,#8E3BA8 80%,#B0307F)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1.5px var(--line)}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:14px;border-radius:12px}
.seg{display:flex;gap:4px;margin-bottom:14px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 8px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.field{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.field:focus,.in:focus{outline:2px solid var(--lav);outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row small{display:block;color:var(--muted);font-size:12.5px}
.tag{font-weight:600;font-size:13px;background:var(--pinkwash);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.up{background:var(--lavfill)}
.bar{height:8px;border-radius:99px;background:var(--lavfill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--lav))}
.ring{position:relative;width:60px;height:60px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:400;font-size:19px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);border-top:0}
.link{background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;padding:6px 0}

/* sesión */
.ex{padding:16px 14px 14px}
.ex .meta{margin:8px 0 6px}
.pista{font-size:15px;margin:8px 0 0}
.notar{font-size:13.5px;color:var(--muted);margin:2px 0 12px}
.sets{display:grid;grid-template-columns:24px 1fr 1fr 52px 46px;gap:8px;align-items:center}
.sets .h{font-size:12px;color:var(--muted);text-align:center}
.sets .n{font-size:14px;color:var(--muted);text-align:center}
.in{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;text-align:center;font-size:17px;font-weight:600;background:#fff;padding:0 4px;-moz-appearance:textfield}
.in::-webkit-outer-spin-button,.in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.in.last::placeholder{color:#B5A9BC;font-weight:400}
.ck{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.ck svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck[aria-pressed=true]{background:var(--pink);border-color:var(--pink)}
.ck[aria-pressed=true] svg{opacity:1}
body[data-t=menu] .ck[aria-pressed=true]{background:var(--lav);border-color:var(--lav)}
.aviso{display:flex;gap:10px;align-items:center;background:var(--lavfill);border-radius:14px;padding:11px 13px;margin:0 0 12px;font-size:14.5px;font-weight:500}
.aviso svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wd.ok{border-color:#BFE3CE}.wd.warn{border-color:#F3D08A}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.wh h3{margin:0;font-family:var(--disp);font-weight:400;font-size:24px;color:var(--pink)}
.chip{font-size:13px;font-weight:700;border-radius:99px;padding:6px 11px;white-space:nowrap}
.chip.ok{background:var(--okwash);color:var(--ok)}.chip.warn{background:var(--warnwash);color:var(--warn)}.chip.empty{background:var(--lavwash);color:var(--lav)}
.wl{display:flex;gap:10px;align-items:baseline;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 0 2px;text-align:left;color:var(--ink);min-height:44px}
.wl b{flex:0 0 92px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--lav)}
.wl span{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.wl em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.wsum{font-size:13px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 18px 8px}
.mc{background:var(--lavwash);border-radius:14px;padding:10px 4px;text-align:center}.mc b{display:block;font-size:19px}.mc span{font-size:11px;color:var(--muted);font-weight:600}
.ing{padding:0 18px;display:flex;flex-direction:column}
.ing div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.ing div span:last-child{font-weight:700;white-space:nowrap}
.act{padding:14px 18px 18px;display:flex;gap:8px}
@media(min-width:760px){.wrap.w{max-width:1100px}.wk{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}

.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;min-height:56px;background:var(--bg);color:var(--ink);font-size:16px;font-weight:700;text-align:left}
.sw i{flex:0 0 50px;height:30px;border-radius:99px;background:#DCD3E3;position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-pressed=true]{border-color:var(--lav);background:var(--lavwash)}.sw[aria-pressed=true] i{background:var(--lav)}.sw[aria-pressed=true] i::after{left:23px}
.free{border:1.5px dashed var(--lav);border-radius:20px;padding:22px 16px;text-align:center;background:var(--lavwash);display:flex;flex-direction:column;gap:6px}
.free b{font-family:var(--disp);font-weight:400;font-size:28px;color:var(--lav)}.free span{color:var(--muted);font-size:15px}
.wd.free{border-color:var(--lavfill);background:var(--lavwash)}
.chip.free{background:var(--lavfill);color:var(--lav)}
.big{width:100%;min-height:56px;border:0;border-radius:16px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--pink),var(--lav))}
.rl{display:flex;flex-direction:column;gap:8px}
.rg{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lav);margin:10px 2px 0}
.ri{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);padding:12px 14px;min-height:60px;text-align:left;color:var(--ink)}
.ri .t{flex:1;min-width:0}.ri .d{font-size:16px;font-weight:600;overflow-wrap:anywhere}.ri .k{font-size:13px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;border-radius:99px;padding:4px 9px;background:var(--pinkwash);color:var(--pink);white-space:nowrap}
.opt.libre{border-style:dashed}
.in{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:17px;color:var(--ink);background:var(--bg)}
.in:focus{outline:2px solid var(--lav);outline-offset:1px}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lav);margin:14px 0 6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pl{min-height:44px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:15px;font-weight:600;color:var(--ink)}
.pl[aria-pressed=true]{background:var(--lav);border-color:var(--lav);color:#fff}
.ei{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0}
.ei .t{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}.ei .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.st{display:flex;align-items:center;gap:4px}
.st button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;color:var(--lav)}
.st input{width:64px;height:40px;text-align:center;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--bg)}
.rm{width:40px;height:40px;border:0;border-radius:12px;background:var(--pinkwash);color:var(--pink);font-size:20px}
.add{width:100%;min-height:52px;border:1.5px dashed var(--lav);border-radius:14px;background:var(--lavwash);color:var(--lav);font-size:16px;font-weight:700;margin-top:10px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 2px;min-height:52px;text-align:left;font-size:16px;font-weight:600;color:var(--ink)}
.pk small{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.sc{overflow:auto;padding:0 18px 8px}
.dis{opacity:.4;pointer-events:none}
.dng{background:var(--pinkwash);color:var(--pink)}
.seg3{grid-template-columns:repeat(3,1fr)}




.rc{font-size:13px;font-weight:700;color:var(--lav);background:var(--lavwash);border:0;border-radius:99px;min-height:36px;padding:0 12px;white-space:nowrap}

.list>*,.rl>*{flex-shrink:0}


.pvov{position:fixed;inset:0;background:rgba(30,20,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:90}
.pvbox{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.pvimgs{overflow:auto;padding:4px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.pvimgs img{width:100%;height:auto;border:1.5px solid var(--line);border-radius:12px;flex-shrink:0}
.pvmsg{padding:0 18px;font-size:14px;color:var(--muted);min-height:20px;text-align:center}

.backb{min-height:44px;border:0;background:var(--lavwash);color:var(--lav);border-radius:99px;padding:0 16px;font-size:16px;font-weight:700}
.wn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:16px;padding:6px}
.wn b{font-size:17px}
.wn button{width:48px;height:44px;border:0;border-radius:12px;background:var(--lavwash);color:var(--lav);font-size:24px;font-weight:700}
.wn button:disabled{opacity:.3}
.ask{border:1.5px solid var(--lav);background:var(--lavwash);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

body{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 24px))}

function exCard(ex,date,sk,w,fase,l){
  var n=ex.series[fase],sets=setsOf(l,ex.id),last=lastOf(ex.id,date),f=S.flags[ex.id];

  if(ex.dropset_semana7&&w&&w.dropsets)h+='<div class="note p">'+svg('info')+'<span>Semana del pico: en la última serie, al llegar al fallo técnico baja el peso un 20–30 % y sigue hasta no poder más.</span></div>';
  if(ex.id==='sentadilla_bulgara')h+='<div class="note p">'+svg('info')+'<span>Sé que este te cuesta, pero ¡va, va, va! 💪</span></div>';
  var bw=BW.indexOf(ex.id)>=0;
  h+='<div class="sets"><span></span><span class="h">'+(bw?'Lastre kg':'Peso kg')+'</span><span class="h">Reps</span><span class="h">RIR</span><span></span>';
  for(var i=0;i<n;i++){
    var s=sets[i]||{},ls=last&&(last.sets[i]||last.sets[last.sets.length-1]),pw='',pr='';
    if(ls&&ls.ok){pw=ls.w;pr=ls.r}

    h+='<input class="in last" inputmode="numeric" enterkeyhint="next" autocomplete="off" aria-label="Repeticiones serie '+(i+1)+'" data-a="r" data-ex="'+ex.id+'" data-i="'+i+'" value="'+(s.r!=null?s.r:'')+'" placeholder="'+(pr!==''?pr:'reps')+'">';
    h+='<input class="in" inputmode="numeric" maxlength="1" enterkeyhint="done" autocomplete="off" aria-label="RIR serie '+(i+1)+'" data-a="rir" data-ex="'+ex.id+'" data-i="'+i+'" value="'+(s.rir!=null?s.rir:'')+'" placeholder="–">';
    h+='<button class="ck" type="button" data-a="ok" data-ex="'+ex.id+'" data-i="'+i+'" aria-pressed="'+!!s.ok+'" aria-label="Serie '+(i+1)+' hecha">'+svg('chk')+'</button>';
  }
  h+='</div>';
  if(last)h+='<p class="small" style="margin-top:10px">Última vez ('+short(last.date)+'): '+okSets(last.sets).map(function(s){return nf(s.w)+' × '+s.r}).join(' · ')+'</p>';
  var sg=l?suggestion(ex,l,fase):null;
  if(sg&&w&&w.n>=2)h+='<div class="sug">'+esc(sg.txt)+'</div>';
  else if(sg)h+='<div class="sug">Calibración: anota el peso con el que te quedaron 1–2 repeticiones en reserva. Será tu peso de partida.</div>';
  var flagged=f&&f.on&&f.since===date;
  h+='<button type="button" class="up-btn" data-a="flag" data-ex="'+ex.id+'" aria-pressed="'+(!!flagged)+'">'+svg('up')+(flagged?'Marcado: subirás peso la próxima semana':'Subir peso la próxima semana')+'</button>';
  h+='<button type="button" class="link" data-a="hist" data-ex="'+ex.id+'">Ver historial de este ejercicio</button></div>';
  return h;
}

function allSessions(){var a=[];Object.keys(S.logs).forEach(function(k){var l=S.logs[k],ok=0;Object.keys(l.ex).forEach(function(e){ok+=okSets(l.ex[e].sets).length});if(ok)a.push(l)});a.sort(function(x,y){return x.date<y.date?-1:1});return a}
function vProg(){
  var h='<h1 class="ink">Progreso</h1><p class="sub">Cómo avanzas, sesión a sesión.</p><div class="seg"><button type="button" data-a="psub" data-s="res" aria-pressed="'+(R.progSub==='res')+'">Resumen</button><button type="button" data-a="psub" data-s="ej" aria-pressed="'+(R.progSub==='ej')+'">Por ejercicio</button></div>';
  return h+(R.progSub==='res'?vResumen():vProgEj());
}
function vResumen(){
  var ss=allSessions();
  if(!ss.length)return '<div class="card"><h3>Aún no hay datos</h3><p class="small" style="margin-top:4px">Cuando completes tu primera sesión, aquí verás tu fuerza y tu volumen semana a semana.</p></div>';
  var series=0,base={},byW={},vol={};
  ss.forEach(function(l){Object.keys(l.ex).forEach(function(id){var ok=okSets(l.ex[id].sets);series+=ok.length;if(!ok.length)return;var t=topW(ok);
    if(t>0){if(base[id]==null)base[id]=t;var wk=l.week==null?0:l.week;(byW[wk]=byW[wk]||[]).push(t/base[id]-1)}
    var wk2=l.week==null?0:l.week;ok.forEach(function(s){vol[wk2]=(vol[wk2]||0)+(s.w>0?s.w*s.r:0)})})});
